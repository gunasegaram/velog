
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VE-Log | Anmeldung</title>

<style>
:root {
    --rot: #922f2b;
    --rot-dunkel: #762522;
    --blau: #1d3557;
    --hintergrund: #f3f4f6;
    --text: #263238;
    --rand: #d9dee5;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--hintergrund);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.login-box {
    width: 100%;
    max-width: 410px;
    padding: 34px;
    background: white;
    border: 1px solid #e8e8e8;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(29, 53, 87, .09);
}

.logo {
    display: flex;
    justify-content: center;
    margin-bottom: 26px;
}

.logo img {
    display: block;
    width: 190px;
    max-width: 100%;
    height: auto;
    object-fit: contain;
}

h1 {
    margin: 0 0 10px;
    color: var(--blau);
    font-size: 27px;
    line-height: 1.25;
}

.intro {
    margin: 0 0 24px;
    color: #667085;
    font-size: 14px;
    line-height: 1.6;
}

label {
    display: block;
    margin: 17px 0 7px;
    font-size: 14px;
    font-weight: 700;
}

input {
    width: 100%;
    min-height: 47px;
    padding: 12px 14px;
    border: 1px solid var(--rand);
    border-radius: 9px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 14px;
}

input:focus {
    outline: 3px solid rgba(29, 53, 87, .13);
    border-color: var(--blau);
}

button, .link-button {
    display: flex;
    width: 100%;
    min-height: 46px;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    border: 0;
    border-radius: 9px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s ease;
}

.primary {
    margin-top: 22px;
    background: var(--rot);
    color: white;
}

.primary:hover { background: var(--rot-dunkel); }

.link-button {
    margin-top: 10px;
    border: 1px solid var(--rand);
    background: white;
    color: var(--blau);
}

.link-button:hover { background: #f5f7fa; }

.guest-link {
    border-color: #d8e2f0;
    background: #edf3fb;
    color: var(--blau);
}

.guest-link:hover { background: #e0eaf8; }

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.divider {
    height: 1px;
    margin: 26px 0 22px;
    background: #e5e7eb;
}

.section-title {
    margin: 0 0 7px;
    color: var(--blau);
    font-size: 16px;
}

.small-text {
    margin: 0 0 14px;
    color: #667085;
    font-size: 13px;
    line-height: 1.5;
}

.status {
    margin: 16px 0 0;
    overflow-wrap: anywhere;
    font-size: 13px;
    line-height: 1.5;
}

.status:empty { display: none; }

@media (max-width: 420px) {
    .login-box { padding: 25px 21px; }
    h1 { font-size: 24px; }
}
</style>
</head>

<body>
<main class="login-box">
    <div class="logo">
        <img src="logo.png" alt="VE-Log GmbH">
    </div>

    <h1>Herzlich Willkommen</h1>
    <p class="intro">
        Melde dich mit deinen Zugangsdaten bei VE-Log an.
    </p>

    <form id="loginForm">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" type="email"
               placeholder="name@beispiel.de"
               autocomplete="username" required>

        <label for="passwort">Passwort</label>
        <input id="passwort" type="password"
               placeholder="Passwort eingeben"
               autocomplete="current-password"
               required>

        <button class="primary" id="loginButton" type="submit">
            Anmelden
        </button>
    </form>

    <a class="link-button guest-link" href="#loginForm"
       id="guestLoginLink">Als Gast anmelden</a>

    <div class="divider"></div>

    <h2 class="section-title">Noch kein Konto?</h2>
    <p class="small-text">
        Wähle aus, welches Konto du erstellen möchtest.
    </p>

    <a class="link-button" href="registrieren.html">
        Mitarbeiterkonto registrieren
    </a>

    <a class="link-button" href="registergast.html">
        Gast registrieren
    </a>

    <p id="status" class="status" role="status"
       aria-live="polite"></p>
</main>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import { getDatabase, ref, get } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDXTAVTeddKxwOp_C_2Z4lPY9yI5bAm0KM",
    authDomain: "ve-log.firebaseapp.com",
    databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ve-log",
    storageBucket: "ve-log.firebasestorage.app",
    messagingSenderId: "749978080433",
    appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const status = document.getElementById("status");

document.getElementById("guestLoginLink").addEventListener("click", () => {
    document.getElementById("email").focus();
    status.textContent =
        "Gäste melden sich hier mit ihrer registrierten E-Mail-Adresse und ihrem Passwort an.";
});

function friendlyError(error) {
    const messages = {
        "auth/invalid-email": "Bitte gib eine gültige E-Mail-Adresse ein.",
        "auth/invalid-credential": "E-Mail-Adresse oder Passwort ist falsch.",
        "auth/user-disabled": "Dieses Konto wurde deaktiviert.",
        "auth/too-many-requests": "Zu viele Versuche. Bitte versuche es später erneut.",
        "auth/network-request-failed": "Netzwerkfehler. Bitte prüfe deine Internetverbindung."
    };
    return messages[error.code] ||
        "Die Anmeldung ist fehlgeschlagen. Bitte versuche es erneut.";
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = "Anmeldung läuft ...";

    try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("passwort").value;

        const credential = await signInWithEmailAndPassword(
            auth, email, password
        );

        const snapshot = await get(
            ref(db, "roles/" + credential.user.uid)
        );

        const role = snapshot.exists() ? snapshot.val() : null;
        const allowedRoles = [
            "gast", "mitarbeiter", "manager", "admin", "superadmin"
        ];

        if (!allowedRoles.includes(role)) {
            await signOut(auth);
            throw new Error(
                "Für dieses Konto ist keine gültige Rolle hinterlegt. Bitte kontaktiere den Administrator."
            );
        }

        window.location.replace("dashboard.html");
    } catch (error) {
        console.error(error);
        status.textContent = error.code
            ? friendlyError(error)
            : error.message;
        button.disabled = false;
    }
});
</script>
</body>
</html>
