<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VE-Log | Anmeldung</title>
<style>
:root{--rot:#922f2b;--rot-dunkel:#762522;--blau:#1d3557;--hintergrund:#f3f4f6;--text:#263238;--rand:#d9dee5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--hintergrund);color:var(--text);font-family:Arial,sans-serif}
.login-box{width:100%;max-width:410px;padding:34px;background:white;border:1px solid #e8e8e8;border-radius:18px;box-shadow:0 12px 40px rgba(29,53,87,.09)}
.logo{display:flex;justify-content:center;margin-bottom:26px}
.logo img{display:block;width:190px;max-width:100%;height:auto;object-fit:contain}
h1{margin:0 0 10px;color:var(--blau);font-size:27px;line-height:1.25}
.intro{margin:0 0 24px;color:#667085;font-size:14px;line-height:1.6}
label{display:block;margin:17px 0 7px;font-size:14px;font-weight:700}
input{width:100%;min-height:47px;padding:12px 14px;border:1px solid var(--rand);border-radius:9px;background:white;color:var(--text);font:inherit;font-size:14px}
input:focus{outline:3px solid rgba(29,53,87,.13);border-color:var(--blau)}
button,.link-button{display:flex;width:100%;min-height:46px;align-items:center;justify-content:center;padding:12px 16px;border:0;border-radius:9px;font:inherit;font-size:14px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;transition:background .15s ease}
.primary{margin-top:22px;background:var(--rot);color:white}.primary:hover{background:var(--rot-dunkel)}
.link-button{margin-top:10px;border:1px solid var(--rand);background:white;color:var(--blau)}
.link-button:hover{background:#f5f7fa}
.guest-link{border-color:#d8e2f0;background:#edf3fb;color:var(--blau)}
button:disabled{opacity:.6;cursor:not-allowed}
.divider{height:1px;margin:26px 0 22px;background:#e5e7eb}
.section-title{margin:0 0 7px;color:var(--blau);font-size:16px}
.small-text{margin:0 0 14px;color:#667085;font-size:13px;line-height:1.5}
.forgot-password{font-size:13px;color:#667085}
.forgot-password a{color:var(--blau)}
.status{margin:16px 0 0;overflow-wrap:anywhere;font-size:13px;line-height:1.5}
.status:empty{display:none}.status.error{color:#b42318}.status.success{color:#067647}
@media(max-width:420px){.login-box{padding:25px 21px}h1{font-size:24px}}
</style>
</head>
<body>
<main class="login-box">
  <div class="logo"><img src="logo.png" alt="VE-Log GmbH"></div>
  <h1>Herzlich Willkommen</h1>
  <p class="intro">Melde dich mit deinen Zugangsdaten bei VE-Log an.</p>

  <form id="loginForm">
    <label for="email">E-Mail-Adresse</label>
    <input id="email" name="email" type="email" placeholder="name@beispiel.de" autocomplete="username" required>
    <label for="passwort">Passwort</label>
    <input id="passwort" name="password" type="password" placeholder="Passwort eingeben" autocomplete="current-password" required>
    <p class="forgot-password">Passwort vergessen? <a href="#" id="resetPasswordLink">Passwort zurücksetzen</a></p>
    <button class="primary" id="loginButton" type="submit">Anmelden</button>
  </form>

  <button class="link-button guest-link" id="guestLoginButton" type="button">Zum Gast-Login</button>
  <div class="divider"></div>
  <h2 class="section-title">Noch kein Konto?</h2>
  <p class="small-text">Wähle aus, welches Konto du erstellen möchtest.</p>
  <a class="link-button" href="registrieren.html">Als Mitarbeiterkonto registrieren</a>
  <a class="link-button" href="registergast.html">Als Gast registrieren</a>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>

<script type="module">
import {initializeApp, getApps} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getDatabase, ref, get} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXTAVTeddKxwOp_C_2Z4lPY9yI5bAm0KM",
  authDomain: "ve-log.firebaseapp.com",
  databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ve-log",
  storageBucket: "ve-log.firebasestorage.app",
  messagingSenderId: "749978080433",
  appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const form = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const guestButton = document.getElementById("guestLoginButton");
const resetLink = document.getElementById("resetPasswordLink");
const statusEl = document.getElementById("status");
let busy = false;

const destinations = {
  gast: "gast.html",
  mitarbeiter: "dashboard.html",
  manager: "dashboard.html",
  admin: "dashboard.html",
  superadmin: "dashboard.html"
};

function showStatus(message, type="") {
  statusEl.textContent = message;
  statusEl.className = "status" + (type ? " " + type : "");
}

function errorText(error) {
  const messages = {
    "auth/invalid-email": "Bitte gib eine gültige E-Mail-Adresse ein.",
    "auth/invalid-credential": "E-Mail-Adresse oder Passwort ist falsch.",
    "auth/user-disabled": "Dieses Konto wurde deaktiviert.",
    "auth/too-many-requests": "Zu viele Anmeldeversuche. Bitte später erneut versuchen.",
    "auth/network-request-failed": "Netzwerkfehler. Bitte Internetverbindung prüfen.",
    "auth/operation-not-allowed": "E-Mail-/Passwort-Anmeldung ist in Firebase nicht aktiviert.",
    "PERMISSION_DENIED": "Firebase verweigert den Zugriff auf die Rolleninformationen. Bitte Realtime-Database-Regeln prüfen.",
    "database/permission-denied": "Firebase verweigert den Zugriff auf die Rolleninformationen. Bitte Realtime-Database-Regeln prüfen."
  };
  return messages[error.code] || error.message || "Die Aktion ist fehlgeschlagen.";
}

resetLink.addEventListener("click", async (event) => {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!email) {
    showStatus("Bitte zuerst deine E-Mail-Adresse eingeben.", "error");
    document.getElementById("email").focus();
    return;
  }
  resetLink.style.pointerEvents = "none";
  try {
    await sendPasswordResetEmail(auth, email);
    showStatus("Falls ein Konto zu dieser Adresse besteht, wurde eine E-Mail zum Zurücksetzen versendet. Bitte auch den Spam-Ordner prüfen.", "success");
  } catch (error) {
    console.error(error);
    showStatus(errorText(error), "error");
  } finally {
    resetLink.style.pointerEvents = "";
  }
});

async function login(event, requireGuest=false) {
  event.preventDefault();
  if (busy) return;
  busy = true;
  loginButton.disabled = true;
  guestButton.disabled = true;
  showStatus("Anmeldung läuft ...");
  let signedInUser = null;

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("passwort").value;
    const credential = await signInWithEmailAndPassword(auth, email, password);
    signedInUser = credential.user;

    const snapshot = await get(ref(db, "roles/" + signedInUser.uid));
    if (!snapshot.exists()) throw new Error("Für dieses Konto ist keine Rolle hinterlegt. Bitte Administrator kontaktieren.");

    const role = snapshot.val();
    if (!["gast","mitarbeiter","manager","admin","superadmin"].includes(role)) {
      throw new Error("Für dieses Konto ist keine gültige Rolle hinterlegt.");
    }
    if (requireGuest && role !== "gast") {
      throw new Error("Dieses Konto ist kein Gastkonto. Bitte normal anmelden.");
    }

    showStatus("Anmeldung erfolgreich. Weiterleitung ...", "success");
    window.location.replace(destinations[role]);
  } catch (error) {
    console.error("Anmeldefehler:", error);
    if (signedInUser && auth.currentUser) {
      try { await signOut(auth); } catch (e) { console.error(e); }
    }
    showStatus(errorText(error), "error");
    busy = false;
    loginButton.disabled = false;
    guestButton.disabled = false;
  }
}

form.addEventListener("submit", (event) => login(event, false));
guestButton.addEventListener("click", (event) => login(event, true));
</script>
</body>
</html>
