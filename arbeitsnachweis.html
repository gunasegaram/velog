<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitsnachweis - VE-Log</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.nav-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav-btn{
    background:#8e2f2b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.nav-btn:hover{
    background:#742522;
}

h1{
    margin-bottom:20px;
    color:#333;
}

.grid-3{
    display:grid;
    grid-template-columns:2fr 2fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

.grid-4{
    display:grid;
    grid-template-columns:2fr 2fr 2fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#444;
}

.weekdays{
    display:flex;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
}

.weekdays label{
    font-weight:normal;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#8e2f2b;
    color:white;
    padding:10px;
    border:1px solid #ddd;
}

td{
    border:1px solid #ddd;
    padding:5px;
}

td input{
    border:none;
}

.save-btn{
    margin-top:20px;
    background:#8e2f2b;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.save-btn:hover{
    background:#742522;
}
</style>
</head>

<body>

<div class="container">

<div class="nav-buttons">
    <button class="nav-btn"
        onclick="window.location.href='formular.html'">
        📋 Formular
    </button>

    <button class="nav-btn"
        onclick="window.location.href='dashboard.html'">
        🏠 Zum Dashboard
    </button>
</div>

<h1>📝 Arbeitsnachweis</h1>

<div class="grid-3">
    <div>
        <label>Name</label>
        <input type="text">
    </div>

    <div>
        <label>Datum</label>
        <input type="date">
    </div>

    <div>
        <label>Std.</label>
        <input type="number" step="0.25">
    </div>
</div>

<div class="weekdays">
    <label><input type="checkbox"> Mo</label>
    <label><input type="checkbox"> Di</label>
    <label><input type="checkbox"> Mi</label>
    <label><input type="checkbox"> Do</label>
    <label><input type="checkbox"> Fr</label>
    <label><input type="checkbox"> Sa</label>
    <label><input type="checkbox"> So</label>
    <label><input type="checkbox"> Sonn-/Feiertag</label>
</div>

<div class="grid-3">
    <div>
        <label>Abwesenheit von</label>
        <input type="time">
    </div>

    <div>
        <label>bis</label>
        <input type="time">
    </div>

    <div>
        <label>Std.</label>
        <input type="number" step="0.25">
    </div>
</div>

<div class="grid-4">
    <div>
        <label>Arbeitsbeginn</label>
        <input type="time">
    </div>

    <div>
        <label>Pause</label>
        <input type="number">
    </div>

    <div>
        <label>Arbeitsende</label>
        <input type="time">
    </div>

    <div>
        <label>Arb.-Std.</label>
        <input type="number" step="0.25">
    </div>
</div>

<div class="grid-3">
    <div>
        <label>Firma</label>
        <input type="text">
    </div>

    <div>
        <label>Kilometer</label>
        <input type="number">
    </div>

    <div>
        <label>Fahr.-Std.</label>
        <input type="number" step="0.25">
    </div>
</div>

<div class="grid-3">
    <div>
        <label>BV</label>
        <input type="text">
    </div>

    <div>
        <label>K.-Stelle</label>
        <input type="text">
    </div>

    <div>
        <label>ges.-Std.</label>
        <input type="number" step="0.25">
    </div>
</div>

<h3>Ausgeführte Arbeiten</h3>

<table>
<tr>
    <th>Uhrzeit von-bis</th>
    <th>Ausgeführte Arbeiten (Platz, Gerät, Material, Tätigkeit)</th>
    <th>Arbeitsstunden</th>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>

<tr>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="number"></td>
</tr>
</table>

<br>

<label>Bemerkungen</label>
<textarea rows="5"></textarea>

<button class="save-btn">
💾 Arbeitsnachweis speichern
</button>

</div>
    

</body>
</html>
