

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE-Log Gastbereich</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    color: #1d3557;
}

header {
    background: #1d3557;
    color: white;
    padding: 20px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

main {
    max-width: 900px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 24px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: #9b2d2d;
    color: white;
    font-size: 15px;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#status {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>
<header>
    <div>
        <strong>VE-Log</strong>
        <div>Gastbereich</div>
    </div>
    <button id="logoutBtn" type="button">Abmelden</button>
</header>

<main>
    <section class="card">
        <h1>Willkommen im Gastbereich</h1>
        <p id="status">Zugriffsberechtigung wird geprüft …</p>
    </section>

    <section class="card" id="profileCard" hidden>
        <h2>Dein Profil</h2>
        <p><strong>Name:</strong> <span id="name"></span></p>
        <p><strong>E-Mail:</strong> <span id="email"></span></p>
    </section>

    <section class="card" id="contentCard" hidden>
        <h2>Freigegebene Informationen</h2>
        <div id="guestContent">Inhalte werden geladen …</div>
    </section>
</main>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDXTAVTeddKxwOp_C_2Z4lPY9yI5bAm0KM",
    authDomain: "ve-log.firebaseapp.com",
    databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ve-log",
    storageBucket: "ve-log.firebasestorage.app",
    messagingSenderId: "749978080433",
    appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

const statusEl = document.getElementById("status");
const logoutBtn = document.getElementById("logoutBtn");

let pruefungLaeuft = false;

function zeigeStatus(text) {
    statusEl.textContent = text;
}

async function abmelden() {
    try {
        await signOut(auth);
    } finally {
        window.location.replace("index.html");
    }
}

logoutBtn.addEventListener("click", abmelden);

onAuthStateChanged(auth, async (user) => {
    if (pruefungLaeuft) return;

    if (!user) {
        window.location.replace("index.html");
        return;
    }

    pruefungLaeuft = true;
    logoutBtn.disabled = true;

    try {
        // Rolle ausschließlich aus dem geschützten Rollenpfad lesen.
        const roleSnapshot = await get(
            ref(database, "roles/" + user.uid)
        );

        if (!roleSnapshot.exists() || roleSnapshot.val() !== "gast") {
            await signOut(auth);
            window.location.replace("index.html");
            return;
        }

        zeigeStatus("Du bist als Gast angemeldet.");

        // Eigenes Profil laden.
        const profileSnapshot = await get(
            ref(database, "users/" + user.uid)
        );

        if (profileSnapshot.exists()) {
            const profile = profileSnapshot.val();

            document.getElementById("name").textContent =
                [profile.vorname, profile.nachname]
                    .filter(Boolean)
                    .join(" ") || "Gast";

            document.getElementById("email").textContent =
                user.email || profile.email || "Keine E-Mail hinterlegt";

            document.getElementById("profileCard").hidden = false;
        }

        // Nur der eigens freigegebene Gastbereich wird gelesen.
        const sharedSnapshot = await get(
            ref(database, "settings/freigegeben")
        );

        const content = document.getElementById("guestContent");
        content.replaceChildren();

        if (sharedSnapshot.exists()) {
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(sharedSnapshot.val(), null, 2);
            content.appendChild(pre);
        } else {
            content.textContent =
                "Aktuell wurden keine Informationen freigegeben.";
        }

        document.getElementById("contentCard").hidden = false;

    } catch (error) {
        console.error("Fehler beim Laden des Gastbereichs:", error);
        zeigeStatus(
            "Der Gastbereich konnte nicht geladen werden. " +
            "Bitte prüfe deine Firebase-Regeln oder versuche es erneut."
        );
    } finally {
        pruefungLaeuft = false;
        logoutBtn.disabled = false;
    }
});
</script>
</body>
</html>
