<style>

/* =========================================================
   GRUNDLAYOUT
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100vh;

    font-family:Arial, sans-serif;

    background:#f4f4f4;

    color:#222;

    overflow-x:hidden;

    -webkit-text-size-adjust:100%;
}


/* =========================================================
   HEADER
========================================================= */

header{
    background:#8e2f2b;
    color:white;

    padding:18px 30px;

    width:100%;
}

header h1{
    font-size:24px;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:1400px;

    margin:auto;

    padding:30px;
}

.form-card{
    width:100%;

    background:white;

    padding:25px;

    border-radius:15px;

    box-shadow:0 0 10px rgba(0,0,0,0.1);
}


/* =========================================================
   EINGABEFELDER
========================================================= */

.row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:15px;
}

.field{
    width:100%;
}

label{
    display:block;

    font-weight:bold;

    margin-bottom:6px;

    font-size:15px;
}

input{
    width:100%;

    min-height:44px;

    padding:10px 12px;

    border:1px solid #ccc;

    border-radius:7px;

    font-size:16px;

    background:white;

    outline:none;
}

input:focus{
    border-color:#8e2f2b;

    box-shadow:0 0 0 2px rgba(142,47,43,0.12);
}


/* =========================================================
   TABELLE
========================================================= */

.table-container{

    width:100%;

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

    margin-top:25px;

    border-radius:6px;
}

table{

    width:100%;

    min-width:850px;

    border-collapse:collapse;

    table-layout:fixed;
}

th{

    background:#8e2f2b;

    color:white;

    padding:12px 8px;

    text-align:center;

    font-size:14px;
}

td{

    border:1px solid #ccc;

    padding:4px;

    vertical-align:top;

    background:white;
}

.klein{

    width:100%;

    min-height:110px;

    border:none;

    resize:none;

    padding:8px;

    font-family:Arial,sans-serif;

    font-size:15px;

    background:transparent;

    outline:none;
}

.gegenstand{

    width:100%;

    min-height:110px;

    border:none;

    resize:vertical;

    padding:8px;

    font-family:Arial,sans-serif;

    font-size:15px;

    background:transparent;

    outline:none;
}


/* =========================================================
   UNTERSCHRIFTEN
========================================================= */

.signature{

    display:grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:20px;

    margin-top:30px;
}

.sig-box{

    border:1px solid #ccc;

    padding:15px;

    min-height:220px;

    border-radius:8px;

    background:#fff;
}

.sig-box strong{

    display:inline-block;

    margin-bottom:4px;

    font-size:16px;
}


/* =========================================================
   DIGITALE UNTERSCHRIFT
========================================================= */

.signature-wrapper{

    margin-top:12px;

    width:100%;
}

.signature-title{

    font-weight:bold;

    margin-bottom:8px;

    font-size:14px;
}

.signature-pad{

    width:100%;

    height:150px;

    border:1px solid #ccc;

    border-radius:8px;

    background:white;

    display:block;

    touch-action:none;

    cursor:crosshair;
}

.signature-buttons{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-top:10px;
}

.signature-btn{

    border:none;

    padding:10px 12px;

    border-radius:6px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    font-size:13px;

    min-height:42px;
}

.signature-clear{
    background:#9b2c2c;
}

.signature-upload{
    background:#444;
}

.signature-save{
    background:#1f4e79;
}

.signature-btn:hover{
    opacity:0.9;
}

.signature-file{
    display:none;
}


/* =========================================================
   BUTTONS
========================================================= */

.button-group{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:25px;
}

.btn{

    border:none;

    padding:13px 20px;

    min-height:46px;

    border-radius:8px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    font-size:15px;

    touch-action:manipulation;
}

.speichern-btn{
    background:#8e2f2b;
}

.druck-btn{
    background:#444;
}

.pdf-btn{
    background:#1f4e79;
}

.back-btn{
    background:#666;
}

.btn:hover{
    opacity:0.9;
}

========================================================= */

@media (max-width:1200px){

<script>

/* =========================================================
   SIGNATUR-PADS
========================================================= */

const signaturePads = {};



function initSignaturePad(canvasId){

    const canvas =
        document.getElementById(canvasId);

    if(!canvas) return;


    const ctx =
        canvas.getContext("2d");


    let drawing = false;


    function resizeCanvas(){

        const rect =
            canvas.getBoundingClientRect();


        const ratio =
            window.devicePixelRatio || 1;


        canvas.width =
            rect.width * ratio;


        canvas.height =
            rect.height * ratio;


        ctx.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );


        ctx.lineWidth = 2;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle = "#000";

    }


    resizeCanvas();


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    function getPosition(event){

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                event.clientX -
                rect.left,

            y:
                event.clientY -
                rect.top

        };

    }


    canvas.addEventListener(
        "pointerdown",
        function(event){

            drawing = true;

            canvas.setPointerCapture(
                event.pointerId
            );


            const position =
                getPosition(event);


            ctx.beginPath();


            ctx.moveTo(
                position.x,
                position.y
            );

        }
    );


    canvas.addEventListener(
        "pointermove",
        function(event){

            if(!drawing) return;


            const position =
                getPosition(event);


            ctx.lineTo(
                position.x,
                position.y
            );


            ctx.stroke();

        }
    );


    canvas.addEventListener(
        "pointerup",
        function(){

            drawing = false;

        }
    );


    canvas.addEventListener(
        "pointercancel",
        function(){

            drawing = false;

        }
    );


    signaturePads[canvasId] = {

        canvas:canvas,

        ctx:ctx

    };

}



/* =========================================================
   SIGNATUR LÖSCHEN
========================================================= */

function clearSignature(canvasId){

    const pad =
        signaturePads[canvasId];


    if(!pad) return;


    pad.ctx.clearRect(

        0,
        0,
        pad.canvas.width,
        pad.canvas.height

    );


    localStorage.removeItem(
        canvasId
    );

}



/* =========================================================
   SIGNATUR HOCHLADEN
========================================================= */

function uploadSignature(canvasId){

    const fileInput =
        document.getElementById(
            "file-" + canvasId
        );


    if(fileInput){

        fileInput.click();

    }

}



/* =========================================================
   BILD LADEN
========================================================= */

function loadSignatureImage(
    input,
    canvasId
){

    const file =
        input.files[0];


    if(!file) return;


    if(!file.type.startsWith("image/")){

        alert(
            "Bitte eine Bilddatei auswählen."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            const image =
                new Image();


            image.onload =
                function(){

                    const pad =
                        signaturePads[canvasId];


                    if(!pad) return;


                    const canvas =
                        pad.canvas;

                    const ctx =
                        pad.ctx;


                    const width =
                        canvas.clientWidth;

                    const height =
                        canvas.clientHeight;


                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    const scale =
                        Math.min(

                            width / image.width,

                            height / image.height

                        );


                    const imageWidth =
                        image.width * scale;


                    const imageHeight =
                        image.height * scale;


                    const x =
                        (width - imageWidth) / 2;


                    const y =
                        (height - imageHeight) / 2;


                    ctx.drawImage(

                        image,

                        x,
                        y,

                        imageWidth,
                        imageHeight

                    );

                };


            image.src =
                event.target.result;

        };


    reader.readAsDataURL(file);

}

        );

/* =========================================================
   SIGNATUR SPEICHERN
========================================================= */

function saveSignatureToStorage(canvasId){

    const pad =
        signaturePads[canvasId];


    if(!pad) return;


    const imageData =
        pad.canvas.toDataURL(
            "image/png"
        );


    localStorage.setItem(
        canvasId,
        imageData
    );

}



/* =========================================================
   SIGNATUR LADEN
========================================================= */

function loadSignatureFromStorage(canvasId){

    const imageData =
        localStorage.getItem(canvasId);


    if(!imageData) return;


    const image =
        new Image();


    image.onload =
        function(){

            const pad =
                signaturePads[canvasId];


            if(!pad) return;


            const canvas =
                pad.canvas;

            const ctx =
                pad.ctx;


            const width =
                canvas.clientWidth;

            const height =
                canvas.clientHeight;


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            const scale =
                Math.min(

                    width / image.width,

                    height / image.height

                );


            const imageWidth =
                image.width * scale;


            const imageHeight =
                image.height * scale;


            const x =
                (width - imageWidth) / 2;


            const y =
                (height - imageHeight) / 2;


            ctx.drawImage(

                image,

                x,
                y,

                imageWidth,
                imageHeight

            );

        };


    image.src =
        imageData;

}
