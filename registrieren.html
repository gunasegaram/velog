<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VE-Log | Mitarbeiterregistrierung</title>
<style>
:root{--rot:#922f2b;--dunkel:#762522;--blau:#1d3557}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#263238}
.box{background:#fff;padding:30px;width:100%;max-width:420px;border-radius:15px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
h2{text-align:center;margin:8px 0 20px;color:var(--blau)}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font:inherit}
button{width:100%;padding:12px;border:0;border-radius:8px;cursor:pointer;font-size:15px;font-weight:700}
.register-btn{margin-top:10px;background:var(--rot);color:#fff}
.register-btn:hover{background:var(--dunkel)}
.back-btn{background:#666;color:#fff;margin-bottom:15px}
.info{font-size:13px;color:#666;margin-top:12px;text-align:center;line-height:1.5}
.status{font-size:13px;line-height:1.5;margin-top:14px;overflow-wrap:anywhere}
.status.error{color:#b42318}.status.success{color:#067647}
button:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>
<main class="box">
  <button class="back-btn" type="button" onclick="location.href='index.html'">← Zurück zum Login</button>
  <h2>Mitarbeiterregistrierung</h2>
  <form id="registerForm">
    <input id="vorname" type="text" placeholder="Vorname" autocomplete="given-name" required>
    <input id="nachname" type="text" placeholder="Nachname" autocomplete="family-name" required>
    <input id="email" type="email" placeholder="E-Mail" autocomplete="email" required>
    <input id="handy" type="tel" placeholder="Telefonnummer" autocomplete="tel">
    <input id="passwort" type="password" placeholder="Passwort (mindestens 6 Zeichen)" autocomplete="new-password" minlength="6" required>
    <input id="passwort2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password" minlength="6" required>
    <button class="register-btn" id="registerButton" type="submit">Mitarbeiterkonto erstellen</button>
  </form>
  <p class="info">Jedes neue Konto erhält automatisch die Rolle „Mitarbeiter“.</p>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>

<script type="module">
import {initializeApp, getApps} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth, createUserWithEmailAndPassword, sendEmailVerification} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getDatabase, ref, set} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXTAVTeddKxwOp_C_2Z4lPY9yI5bAm0KM",
  authDomain: "ve-log.firebaseapp.com",
  databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ve-log",
  storageBucket: "ve-log.firebasestorage.app",
  messagingSenderId: "749978080433",
  appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const form = document.getElementById("registerForm");
const button = document.getElementById("registerButton");
const statusEl = document.getElementById("status");

function showStatus(message, type="") {
  statusEl.textContent = message;
  statusEl.className = "status" + (type ? " " + type : "");
}
function errorText(error) {
  const messages = {
    "auth/email-already-in-use": "Diese E-Mail-Adresse ist bereits registriert.",
    "auth/weak-password": "Das Passwort muss mindestens 6 Zeichen lang sein.",
    "auth/invalid-email": "Bitte eine gültige E-Mail-Adresse eingeben.",
    "auth/operation-not-allowed": "E-Mail-/Passwort-Registrierung ist in Firebase nicht aktiviert.",
    "auth/network-request-failed": "Netzwerkfehler. Bitte Internetverbindung prüfen.",
    "PERMISSION_DENIED": "Firebase hat den Datenbankzugriff verweigert. Prüfe die Realtime-Database-Regeln."
  };
  return messages[error.code] || error.message || "Registrierung fehlgeschlagen.";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  showStatus("Konto wird erstellt ...");

  let createdUser = null;
  let profileSaved = false;
  let roleSaved = false;

  const vorname = document.getElementById("vorname").value.trim();
  const nachname = document.getElementById("nachname").value.trim();
  const email = document.getElementById("email").value.trim();
  const handy = document.getElementById("handy").value.trim();
  const password = document.getElementById("passwort").value;
  const password2 = document.getElementById("passwort2").value;

  if (password !== password2) {
    showStatus("Die Passwörter stimmen nicht überein.", "error");
    button.disabled = false;
    return;
  }

  try {
    // Schritt 1: Firebase-Authentication-Konto anlegen
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    createdUser = credential.user;
    const uid = createdUser.uid;

    // Schritt 2: ZUERST die Rolle schreiben.
    // Die Rules müssen diese einmalige Selbstzuweisung erlauben.
    await set(ref(db, "roles/" + uid), "mitarbeiter");
    roleSaved = true;

    // Schritt 3: Danach Profil schreiben, damit die .validate-Regel
    // für users/$uid/rolle die bereits gespeicherte Rolle findet.
    await set(ref(db, "users/" + uid), {
      uid,
      vorname,
      nachname,
      email,
      handy,
      rolle: "mitarbeiter",
      aktiv: true,
      erstelltAm: new Date().toISOString()
    });
    profileSaved = true;

    // Schritt 4: Verifizierungs-E-Mail senden.
    // Ein Fehler beim Mailversand löscht das Konto/Profil nicht.
    try {
      await sendEmailVerification(createdUser);
      showStatus("Konto erstellt! Deine Rolle ist Mitarbeiter. Bitte bestätige deine E-Mail-Adresse über den zugesandten Link. Du wirst zum Login weitergeleitet.", "success");
    } catch (mailError) {
      console.error("Verifizierungs-E-Mail konnte nicht gesendet werden:", mailError);
      showStatus("Konto und Mitarbeiterprofil wurden erstellt, aber die Verifizierungs-E-Mail konnte nicht gesendet werden. Bitte später erneut versuchen.", "error");
      button.disabled = false;
      return;
    }

    setTimeout(() => location.replace("index.html"), 2500);

  } catch (error) {
    console.error("Registrierungsfehler:", error);
    let detail = errorText(error);

    if (createdUser) {
      detail += " Das Auth-Konto wurde bereits erstellt.";
      if (roleSaved) detail += " Die Mitarbeiterrolle wurde gespeichert.";
      if (!profileSaved) detail += " Das Mitarbeiterprofil fehlt noch; bitte Administrator kontaktieren, bevor du dich erneut registrierst.";
    }

    showStatus(detail, "error");
    button.disabled = false;
  }
});
</script>
</body>
</html>
